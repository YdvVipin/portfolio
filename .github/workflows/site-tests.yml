name: Site Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Runs on main record metrics and commit them back; never run two at once there.
concurrency:
  group: site-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Playwright + axe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run site tests
        id: tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-json
          path: test-results/results.json
          retention-days: 14

      # ─── Quality Dashboard: record this run (main only) ───
      - name: Record metrics (tests + Lighthouse)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        run: node scripts/qa-metrics.mjs test-results/results.json

      - name: Commit metrics
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('data/qa-metrics.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add data/qa-metrics.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(metrics): record site test run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
